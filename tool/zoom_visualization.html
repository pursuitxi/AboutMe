<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Zoom Visualization</title>
  <style>

:root {
  --paper: #f7f5ef;
  --paper-2: #eeeae1;
  --glass: rgba(255, 255, 255, 0.62);
  --glass-strong: rgba(255, 255, 255, 0.78);
  --glass-soft: rgba(255, 255, 255, 0.46);
  --hairline: rgba(82, 78, 68, 0.16);
  --hairline-soft: rgba(82, 78, 68, 0.10);
  --text: #262522;
  --subtle: #56534c;
  --muted: #868178;
  --accent: #73716b;
  --accent-2: #d8d3c8;
  --accent-3: #c9c3b7;
  --success: #a6a094;
  --shadow: 0 24px 80px rgba(58, 55, 48, 0.14);
  --card-shadow: 0 14px 42px rgba(58, 55, 48, 0.10), inset 0 1px 0 rgba(255,255,255,0.80);
  --radius-xl: 28px;
  --radius-lg: 21px;
  --radius-md: 16px;
  --radius-sm: 12px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--text);
  overflow: hidden;
  background:
    radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.78), transparent 28rem),
    radial-gradient(circle at 90% 16%, rgba(218, 214, 204, 0.32), transparent 30rem),
    radial-gradient(circle at 52% 96%, rgba(232, 228, 219, 0.38), transparent 34rem),
    linear-gradient(145deg, #fbfaf7 0%, var(--paper) 52%, #ebe7dd 100%);
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(108, 102, 91, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(108, 102, 91, 0.038) 1px, transparent 1px);
  background-size: 46px 46px;
  mask-image: radial-gradient(circle at 55% 30%, black, transparent 76%);
}
button, input, select { font: inherit; }
button, label[for] { -webkit-tap-highlight-color: transparent; }

.app-shell {
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

.topbar {
  min-height: 66px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 10px 16px;
  background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.48));
  border-bottom: 1px solid var(--hairline-soft);
  box-shadow: 0 12px 40px rgba(58, 55, 48, 0.09);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  z-index: 3;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 15px;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,0.98), rgba(255,255,255,0.52) 28%, transparent 48%),
    linear-gradient(145deg, rgba(255,255,255,0.82), rgba(232,228,219,0.86) 56%, rgba(214,208,198,0.72));
  box-shadow: 0 12px 30px rgba(58,55,48,0.13), inset 0 1px 0 rgba(255,255,255,0.88);
  color: #5e5a52;
  font-size: 23px;
  line-height: 1;
}
.brand h1 { margin: 0; font-size: 15px; letter-spacing: 0.01em; font-weight: 760; }
.brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
.top-actions { display: flex; gap: 9px; }

.button {
  min-height: 37px;
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 8px 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--text);
  cursor: pointer;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.005em;
  transition: transform 130ms ease, background 130ms ease, border-color 130ms ease, opacity 130ms ease, box-shadow 130ms ease;
  user-select: none;
}
.button:hover:not(:disabled) { transform: translateY(-1px); }
.button:active:not(:disabled) { transform: translateY(0); }
.button:disabled { cursor: not-allowed; opacity: 0.42; }
.button-primary {
  background: linear-gradient(180deg, rgba(255,255,255,0.86), rgba(232,228,219,0.72));
  color: var(--text);
  box-shadow: 0 12px 30px rgba(112, 109, 101, 0.24), inset 0 1px 0 rgba(255,255,255,0.45);
}
.button-primary:hover:not(:disabled) { box-shadow: 0 14px 36px rgba(112, 109, 101, 0.31), inset 0 1px 0 rgba(255,255,255,0.55); }
.button-secondary {
  background: rgba(255,255,255,0.52);
  border-color: var(--hairline-soft);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.72), 0 6px 18px rgba(58, 55, 48, 0.06);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
}
.button-secondary:hover { background: rgba(255,255,255,0.72); border-color: var(--hairline); }
.button-wide {
  width: 100%;
  min-height: 40px;
  background: linear-gradient(180deg, rgba(255,255,255,0.74), rgba(255,255,255,0.44));
  border-color: rgba(112, 109, 101, 0.18);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.74), 0 8px 22px rgba(58, 55, 48, 0.08);
}
.button-wide:hover { background: linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.55)); }

.workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: 318px minmax(0, 1fr);
  padding: 12px;
  gap: 12px;
}

.control-panel {
  position: relative;
  min-height: 0;
  overflow-y: auto;
  padding: 12px;
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-xl);
  background: linear-gradient(180deg, rgba(255,255,255,0.68), rgba(255,255,255,0.38));
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.76);
  backdrop-filter: blur(34px) saturate(185%);
  -webkit-backdrop-filter: blur(34px) saturate(185%);
  scrollbar-width: none;
}
.control-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    radial-gradient(circle at 14% 0%, rgba(255,255,255,0.78), transparent 35%),
    radial-gradient(circle at 100% 24%, rgba(226, 222, 213, 0.24), transparent 40%),
    radial-gradient(circle at 8% 100%, rgba(204, 198, 187, 0.10), transparent 32%);
  opacity: 0.95;
}
.control-panel::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}
.control-layout {
  position: relative;
  display: grid;
  gap: 10px;
}

.panel-section {
  padding: 12px;
  border: 1px solid rgba(82, 78, 68, 0.12);
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgba(255,255,255,0.62), rgba(255,255,255,0.34));
  box-shadow: var(--card-shadow);
  backdrop-filter: blur(24px) saturate(175%);
  -webkit-backdrop-filter: blur(24px) saturate(175%);
}
.panel-section.hero {
  padding: 12px;
  overflow: hidden;
  background:
    radial-gradient(circle at 82% 0%, rgba(204, 198, 187, 0.16), transparent 42%),
    radial-gradient(circle at 0% 100%, rgba(226, 222, 213, 0.24), transparent 42%),
    linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.38));
}
.toolbar-hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.hero-text h2,
.section-heading h2,
.panel-note h2 { margin: 0; font-size: 13px; letter-spacing: 0.04em; font-weight: 780; color: var(--text); }
.hero-text p,
.panel-note p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.52;
}
.hero-badge {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  border: 1px solid rgba(82, 78, 68, 0.14);
  border-radius: 999px;
  color: #5d5a52;
  background: rgba(255,255,255,0.55);
  font-size: 11px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
}
.hero-badge::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--success);
  box-shadow: 0 0 12px rgba(112,109,101,0.24);
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
}
.stat-chip {
  padding: 9px 8px 8px;
  border-radius: 15px;
  background: rgba(255,255,255,0.46);
  border: 1px solid rgba(82, 78, 68, 0.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.74);
}
.stat-chip strong {
  display: block;
  font-size: 11.5px;
  color: var(--subtle);
  margin-bottom: 4px;
  white-space: nowrap;
}
.stat-chip span {
  color: var(--muted);
  font-size: 10.5px;
  display: block;
  white-space: nowrap;
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 9px;
}
.section-heading span {
  color: var(--muted);
  font-size: 10.5px;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.46);
  border: 1px solid rgba(82, 78, 68, 0.10);
}

.field { display: grid; gap: 6px; margin-bottom: 9px; }
.field:last-child { margin-bottom: 0; }
.field > span,
.mini-field > span {
  color: var(--subtle);
  font-size: 11.5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.field output { color: var(--text); font-variant-numeric: tabular-nums; }
.compact-grid,
.field-grid { display: grid; gap: 8px; }
.compact-grid-2,
.field-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.compact-grid > .mini-field,
.field-grid > .field { margin: 0; min-width: 0; align-self: start; }
.mini-field { display: grid; gap: 5px; min-width: 0; }

input[type="number"], select {
  width: 100%;
  min-height: 36px;
  padding: 7px 10px;
  border: 1px solid rgba(82, 78, 68, 0.15);
  border-radius: 13px;
  background: rgba(255,255,255,0.60);
  color: var(--text);
  outline: none;
  font-variant-numeric: tabular-nums;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.78), 0 6px 18px rgba(58, 55, 48, 0.06);
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
}
input[type="number"]:focus, select:focus {
  border-color: rgba(112, 109, 101, 0.52);
  box-shadow: 0 0 0 3px rgba(112, 109, 101, 0.12), inset 0 1px 0 rgba(255,255,255,0.82);
  background: rgba(255,255,255,0.78);
}
.range-wrap { display: grid; gap: 7px; }
.range-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--subtle);
  font-size: 11.5px;
}
.range-value {
  color: #64615a;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(112, 109, 101, 0.10);
  border: 1px solid rgba(112, 109, 101, 0.14);
  font-variant-numeric: tabular-nums;
}
.range {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
}

.segmented { display: grid; gap: 7px; }
.segmented-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.segmented label { position: relative; cursor: pointer; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented span {
  min-height: 34px;
  display: grid;
  place-items: center;
  padding: 7px 9px;
  border: 1px solid rgba(82, 78, 68, 0.13);
  border-radius: 13px;
  background: rgba(255,255,255,0.50);
  color: var(--muted);
  font-size: 11.5px;
  transition: 130ms ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.70);
}
.segmented input:checked + span {
  border-color: rgba(112, 109, 101, 0.28);
  background: linear-gradient(180deg, rgba(226, 222, 213, 0.32), rgba(112, 109, 101, 0.16));
  color: #474640;
  box-shadow: 0 8px 18px rgba(112, 109, 101, 0.10), inset 0 1px 0 rgba(255,255,255,0.76);
}

.color-palette { display: flex; flex-wrap: wrap; gap: 8px; }
.color-swatch {
  width: 25px;
  height: 25px;
  padding: 0;
  border: 2px solid rgba(255,255,255,0.75);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(82, 78, 68, 0.12), 0 6px 13px rgba(58, 55, 48, 0.14);
}
.color-swatch[aria-pressed="true"] { outline: 2px solid rgba(112, 109, 101, 0.55); outline-offset: 2px; }
.custom-color {
  margin-top: 9px;
  min-height: 38px;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border: 1px solid rgba(82, 78, 68, 0.13);
  border-radius: 13px;
  background: rgba(255,255,255,0.50);
  cursor: pointer;
  font-size: 11.5px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.70);
}
.custom-color input { width: 28px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; }
.custom-color code { color: var(--muted); font-size: 10.5px; }
.inline-dual {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 104px;
  gap: 9px;
  align-items: end;
}

.panel-note {
  border-style: solid;
  background: linear-gradient(180deg, rgba(255,255,255,0.50), rgba(255,255,255,0.28));
}
.tip-list {
  margin: 7px 0 0;
  padding-left: 17px;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.62;
}
.tip-list li + li { margin-top: 3px; }

.canvas-stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid rgba(82, 78, 68, 0.13);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.68);
  background-color: rgba(249, 248, 245, 0.86);
  background-image:
    linear-gradient(45deg, rgba(116, 111, 100, 0.10) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(116, 111, 100, 0.10) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(116, 111, 100, 0.10) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(116, 111, 100, 0.10) 75%);
  background-size: 28px 28px;
  background-position: 0 0, 0 14px, 14px -14px, -14px 0;
}
#previewCanvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
.empty-state {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  text-align: center;
  padding: 30px;
  pointer-events: none;
}
.empty-state > * { pointer-events: auto; }
.empty-icon {
  width: 76px;
  height: 76px;
  display: grid;
  place-items: center;
  margin-bottom: 16px;
  border: 1px solid rgba(82, 78, 68, 0.12);
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.44));
  color: rgba(63, 77, 102, 0.66);
  font-size: 34px;
  box-shadow: 0 18px 56px rgba(58, 55, 48, 0.18), inset 0 1px 0 rgba(255,255,255,0.84);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
}
.empty-state h2 { margin: 0; font-size: 20px; font-weight: 780; color: var(--text); }
.empty-state p { max-width: 420px; margin: 9px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
.empty-state[hidden], .drop-overlay[hidden] { display: none; }
.drop-overlay {
  position: absolute;
  inset: 14px;
  display: grid;
  place-items: center;
  border: 2px dashed rgba(112, 109, 101, 0.45);
  border-radius: 22px;
  background: rgba(112, 109, 101, 0.10);
  color: #64615a;
  backdrop-filter: blur(14px) saturate(170%);
  -webkit-backdrop-filter: blur(14px) saturate(170%);
  z-index: 4;
  pointer-events: none;
}
.statusbar {
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 6px 16px;
  border-top: 1px solid var(--hairline-soft);
  background: rgba(255,255,255,0.54);
  color: var(--muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
}
.statusbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#imageMeta { flex: 0 0 auto; }
#lineStyle {
  font-size: 12px;
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .topbar, .control-panel, .panel-section, .button-secondary, input[type="number"], select, .empty-icon, .statusbar {
    background-color: rgba(255, 255, 255, 0.94);
  }
}

@media (max-width: 980px) {
  .workspace { grid-template-columns: 300px minmax(0, 1fr); }
  .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  body { overflow: auto; }
  .app-shell { min-height: 100dvh; height: auto; grid-template-rows: auto auto auto; }
  .topbar { position: sticky; top: 0; }
  .brand p { display: none; }
  .workspace { grid-template-columns: 1fr; }
  .control-panel { overflow: visible; }
  .canvas-stage { min-height: 60dvh; }
  .statusbar { position: sticky; bottom: 0; }
}
@media (max-width: 520px) {
  .topbar { align-items: flex-start; }
  .brand-mark { width: 38px; height: 38px; border-radius: 13px; font-size: 22px; }
  .brand h1 { font-size: 14px; }
  .top-actions { flex-direction: column; width: 118px; }
  .button { min-height: 34px; padding: 7px 10px; font-size: 12px; }
  .stats-grid,
  .compact-grid-2,
  .field-grid-2,
  .segmented-2,
  .inline-dual { grid-template-columns: 1fr; }
  .statusbar { display: block; line-height: 1.5; }
  #imageMeta { display: none; }
}

</style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⌕</div>
        <div>
          <h1>Zoom Visualization</h1>
          <!-- <p>图片局部放大标注工具</p> -->
        </div>
      </div>
      <div class="top-actions">
        <label class="button button-secondary" for="imageInput">加载图片</label>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff" hidden>
        <button id="exportButton" class="button button-primary" type="button" disabled>导出 PNG</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="control-panel" aria-label="标注参数">
        <div class="control-layout">

          <section class="panel-section">
            <div class="section-heading">
              <h2>几何控制</h2>
              <span>原图像素</span>
            </div>
            <div class="compact-grid compact-grid-2">
              <label class="mini-field">
                <span>宽度</span>
                <input id="boxWidth" type="number" min="10" max="2000" step="1" value="100">
              </label>
              <label class="mini-field">
                <span>高度</span>
                <input id="boxHeight" type="number" min="10" max="2000" step="1" value="100">
              </label>
              <label class="mini-field">
                <span>X</span>
                <input id="coordX" type="number" step="1" value="0">
              </label>
              <label class="mini-field">
                <span>Y</span>
                <input id="coordY" type="number" step="1" value="0">
              </label>
            </div>
            <div class="field" style="margin-top: 10px;">
              <div class="range-wrap">
                <div class="range-meta">
                  <span>放大倍数</span>
                  <output id="zoomFactorOutput" class="range-value">4×</output>
                </div>
                <input id="zoomFactor" class="range" type="range" min="2" max="16" step="1" value="4">
              </div>
            </div>
            <button id="locateButton" class="button button-wide" type="button" disabled>定位源框</button>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <h2>布局与连线</h2>
              <span>视觉样式</span>
            </div>
            <div class="field">
              <span>放大框位置</span>
              <div class="segmented segmented-2" role="radiogroup" aria-label="放大框位置">
                <label><input type="radio" name="zoomCorner" value="TL"><span>左上</span></label>
                <label><input type="radio" name="zoomCorner" value="TR"><span>右上</span></label>
                <label><input type="radio" name="zoomCorner" value="BL" checked><span>左下</span></label>
                <label><input type="radio" name="zoomCorner" value="BR"><span>右下</span></label>
              </div>
            </div>
            <div class="inline-dual">
              <label class="field">
                <span>线条样式</span>
                <select id="lineStyle">
                  <option value="solid">实线</option>
                  <option value="dashed">虚线</option>
                  <option value="dotted">点线</option>
                  <option value="dash_dot" selected>点划线</option>
                  <option value="arrow">双向箭头</option>
                  <option value="double">双线</option>
                </select>
              </label>
              <label class="field">
                <div class="range-wrap">
                  <div class="range-meta">
                    <span>线宽</span>
                    <output id="lineWidthOutput" class="range-value">8 px</output>
                  </div>
                  <input id="lineWidth" class="range" type="range" min="2" max="15" step="1" value="8">
                </div>
              </label>
            </div>
            <div class="field">
              <span>颜色</span>
              <div id="colorPalette" class="color-palette" aria-label="预设颜色"></div>
              <label class="custom-color">
                <input id="lineColor" type="color" value="#ff3b30">
                <span>自定义颜色</span>
                <code id="colorCode">#FF3B30</code>
              </label>
            </div>
          </section>

          <section class="panel-section panel-note">
            <h2>操作提示</h2>
            <ul class="tip-list">
              <li>点击图片可放置源框，按住源框可拖动微调</li>
              <li>导出结果会按原始分辨率重新绘制</li>
              <li>拖入图片即可开始</li>
            </ul>
          </section>
        </div>
      </aside>

      <section id="canvasStage" class="canvas-stage" aria-label="图片预览区">
        <canvas id="previewCanvas"></canvas>
        <div id="emptyState" class="empty-state">
          <div class="empty-icon" aria-hidden="true">▧</div>
          <h2>拖入一张图片开始</h2>
          <p>也可以点击“加载图片”</p>
          <label class="button button-primary" for="imageInput">选择图片</label>
        </div>
        <div id="dropOverlay" class="drop-overlay" hidden>
          <strong>松开以加载图片</strong>
        </div>
      </section>
    </section>

    <footer class="statusbar">
      <span id="statusText">请加载一张图片，然后点击图片或输入坐标放置放大框。</span>
      <span id="imageMeta">未加载图片</span>
    </footer>
  </main>

  <script>
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.ZoomCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  function clamp(value, min, max) {
    if (max < min) return min;
    return Math.max(min, Math.min(max, value));
  }

  function clampSourceBox(box, imageWidth, imageHeight) {
    const width = clamp(Math.round(Number(box.width) || 1), 1, imageWidth);
    const height = clamp(Math.round(Number(box.height) || 1), 1, imageHeight);
    const x = clamp(Math.round(Number(box.x) || 0), 0, imageWidth - width);
    const y = clamp(Math.round(Number(box.y) || 0), 0, imageHeight - height);
    return { x, y, width, height };
  }

  function computeZoomBox(corner, imageWidth, imageHeight, zoomWidth, zoomHeight, pad) {
    const safePad = Math.max(0, Number(pad) || 0);
    const width = Math.max(1, Number(zoomWidth) || 1);
    const height = Math.max(1, Number(zoomHeight) || 1);
    const right = imageWidth - width - safePad;
    const bottom = imageHeight - height - safePad;

    switch (corner) {
      case 'TL': return { x: safePad, y: safePad, width, height };
      case 'TR': return { x: right, y: safePad, width, height };
      case 'BR': return { x: right, y: bottom, width, height };
      case 'BL':
      default: return { x: safePad, y: bottom, width, height };
    }
  }

  function getConnectionPoints(corner, source, zoom) {
    if (corner === 'TL' || corner === 'BR') {
      return [
        [
          { x: source.x + source.width, y: source.y },
          { x: zoom.x + zoom.width, y: zoom.y },
        ],
        [
          { x: source.x, y: source.y + source.height },
          { x: zoom.x, y: zoom.y + zoom.height },
        ],
      ];
    }

    return [
      [
        { x: source.x, y: source.y },
        { x: zoom.x, y: zoom.y },
      ],
      [
        { x: source.x + source.width, y: source.y + source.height },
        { x: zoom.x + zoom.width, y: zoom.y + zoom.height },
      ],
    ];
  }

  function getLinePattern(style, width) {
    const w = Math.max(1, Number(width) || 1);
    switch (style) {
      case 'dashed': return [Math.max(12, w * 5), Math.max(6, w * 3)];
      case 'dotted': return [Math.max(2, w), Math.max(5, w * 3)];
      case 'dash_dot': return [Math.max(14, w * 6), Math.max(5, w * 2), Math.max(2, w), Math.max(5, w * 2)];
      default: return [];
    }
  }

  return {
    clamp,
    clampSourceBox,
    computeZoomBox,
    getConnectionPoints,
    getLinePattern,
  };
});

</script>
  <script>
(() => {
  'use strict';

  const {
    clamp,
    clampSourceBox,
    computeZoomBox,
    getConnectionPoints,
    getLinePattern,
  } = window.ZoomCore;

  const PAD = 12;
  const COLORS = ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#007AFF', '#AF52DE', '#FFFFFF', '#000000'];

  const elements = {
    imageInput: document.querySelector('#imageInput'),
    exportButton: document.querySelector('#exportButton'),
    locateButton: document.querySelector('#locateButton'),
    boxWidth: document.querySelector('#boxWidth'),
    boxHeight: document.querySelector('#boxHeight'),
    zoomFactor: document.querySelector('#zoomFactor'),
    zoomFactorOutput: document.querySelector('#zoomFactorOutput'),
    coordX: document.querySelector('#coordX'),
    coordY: document.querySelector('#coordY'),
    lineStyle: document.querySelector('#lineStyle'),
    lineWidth: document.querySelector('#lineWidth'),
    lineWidthOutput: document.querySelector('#lineWidthOutput'),
    lineColor: document.querySelector('#lineColor'),
    colorCode: document.querySelector('#colorCode'),
    colorPalette: document.querySelector('#colorPalette'),
    canvasStage: document.querySelector('#canvasStage'),
    canvas: document.querySelector('#previewCanvas'),
    emptyState: document.querySelector('#emptyState'),
    dropOverlay: document.querySelector('#dropOverlay'),
    statusText: document.querySelector('#statusText'),
    imageMeta: document.querySelector('#imageMeta'),
  };

  const ctx = elements.canvas.getContext('2d');

  const state = {
    image: null,
    fileName: '',
    source: null,
    preview: { cssWidth: 1, cssHeight: 1, scale: 1, offsetX: 0, offsetY: 0, drawWidth: 0, drawHeight: 0 },
    corner: 'BL',
    lineColor: '#FF3B30',
    drag: null,
    dragDepth: 0,
  };

  function numericValue(input, fallback) {
    const value = Number(input.value);
    return Number.isFinite(value) ? value : fallback;
  }

  function currentSettings() {
    return {
      boxWidth: clamp(Math.round(numericValue(elements.boxWidth, 100)), 10, 2000),
      boxHeight: clamp(Math.round(numericValue(elements.boxHeight, 100)), 10, 2000),
      zoomFactor: clamp(Math.round(numericValue(elements.zoomFactor, 4)), 2, 16),
      lineWidth: clamp(Math.round(numericValue(elements.lineWidth, 8)), 2, 15),
      lineStyle: elements.lineStyle.value,
      lineColor: state.lineColor,
      corner: state.corner,
    };
  }

  function setStatus(message) {
    elements.statusText.textContent = message;
  }

  function updateOutputs() {
    elements.zoomFactorOutput.value = `${elements.zoomFactor.value}×`;
    elements.zoomFactorOutput.textContent = `${elements.zoomFactor.value}×`;
    elements.lineWidthOutput.value = `${elements.lineWidth.value} px`;
    elements.lineWidthOutput.textContent = `${elements.lineWidth.value} px`;
    elements.colorCode.textContent = state.lineColor.toUpperCase();
  }

  function buildColorPalette() {
    const fragment = document.createDocumentFragment();
    COLORS.forEach((color) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'color-swatch';
      button.style.background = color;
      button.title = color;
      button.setAttribute('aria-label', `选择颜色 ${color}`);
      button.setAttribute('aria-pressed', String(color === state.lineColor));
      button.addEventListener('click', () => setLineColor(color));
      fragment.appendChild(button);
    });
    elements.colorPalette.appendChild(fragment);
  }

  function setLineColor(color) {
    state.lineColor = String(color).toUpperCase();
    elements.lineColor.value = state.lineColor;
    elements.colorCode.textContent = state.lineColor;
    elements.colorPalette.querySelectorAll('.color-swatch').forEach((swatch) => {
      swatch.setAttribute('aria-pressed', String(swatch.title.toUpperCase() === state.lineColor));
    });
    renderPreview();
  }

  function setSource(source, updateFields = true) {
    if (!state.image) return;
    state.source = clampSourceBox(source, state.image.naturalWidth, state.image.naturalHeight);
    if (updateFields) {
      elements.coordX.value = state.source.x;
      elements.coordY.value = state.source.y;
    }
    renderPreview();
  }

  function applyCoordinates() {
    if (!state.image) return;
    const settings = currentSettings();
    setSource({
      x: Math.round(numericValue(elements.coordX, 0)),
      y: Math.round(numericValue(elements.coordY, 0)),
      width: settings.boxWidth,
      height: settings.boxHeight,
    });
    setStatus(`源框已定位到 (${state.source.x}, ${state.source.y})。`);
  }

  function syncSourceSize() {
    if (!state.image || !state.source) {
      renderPreview();
      return;
    }
    const settings = currentSettings();
    setSource({ ...state.source, width: settings.boxWidth, height: settings.boxHeight });
  }

  function resizeCanvas() {
    const rect = elements.canvasStage.getBoundingClientRect();
    const cssWidth = Math.max(1, Math.round(rect.width));
    const cssHeight = Math.max(1, Math.round(rect.height));
    const dpr = Math.max(1, window.devicePixelRatio || 1);

    if (elements.canvas.width !== Math.round(cssWidth * dpr) || elements.canvas.height !== Math.round(cssHeight * dpr)) {
      elements.canvas.width = Math.round(cssWidth * dpr);
      elements.canvas.height = Math.round(cssHeight * dpr);
      elements.canvas.style.width = `${cssWidth}px`;
      elements.canvas.style.height = `${cssHeight}px`;
    }

    state.preview.cssWidth = cssWidth;
    state.preview.cssHeight = cssHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    renderPreview();
  }

  function fitPreview() {
    if (!state.image) return;
    const iw = state.image.naturalWidth;
    const ih = state.image.naturalHeight;
    const scale = Math.min(state.preview.cssWidth / iw, state.preview.cssHeight / ih, 1);
    const drawWidth = Math.max(1, iw * scale);
    const drawHeight = Math.max(1, ih * scale);

    state.preview.scale = scale;
    state.preview.drawWidth = drawWidth;
    state.preview.drawHeight = drawHeight;
    state.preview.offsetX = (state.preview.cssWidth - drawWidth) / 2;
    state.preview.offsetY = (state.preview.cssHeight - drawHeight) / 2;
  }

  function originalToPreviewBox(box) {
    const { scale, offsetX, offsetY } = state.preview;
    return {
      x: offsetX + box.x * scale,
      y: offsetY + box.y * scale,
      width: box.width * scale,
      height: box.height * scale,
    };
  }

  function previewPointToOriginal(clientX, clientY) {
    const rect = elements.canvas.getBoundingClientRect();
    const px = clientX - rect.left;
    const py = clientY - rect.top;
    const { scale, offsetX, offsetY, drawWidth, drawHeight } = state.preview;
    const inside = px >= offsetX && px <= offsetX + drawWidth && py >= offsetY && py <= offsetY + drawHeight;
    return {
      inside,
      previewX: px,
      previewY: py,
      x: Math.round((px - offsetX) / scale),
      y: Math.round((py - offsetY) / scale),
    };
  }

  function renderPreview() {
    const { cssWidth, cssHeight } = state.preview;
    ctx.clearRect(0, 0, cssWidth, cssHeight);
    if (!state.image) return;

    fitPreview();
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(
      state.image,
      state.preview.offsetX,
      state.preview.offsetY,
      state.preview.drawWidth,
      state.preview.drawHeight,
    );
    ctx.restore();

    if (!state.source) return;

    const settings = currentSettings();
    const sourcePreview = originalToPreviewBox(state.source);
    const zoomPreview = computeZoomBox(
      settings.corner,
      state.preview.drawWidth,
      state.preview.drawHeight,
      sourcePreview.width * settings.zoomFactor,
      sourcePreview.height * settings.zoomFactor,
      PAD,
    );
    zoomPreview.x += state.preview.offsetX;
    zoomPreview.y += state.preview.offsetY;

    drawZoomedCrop(ctx, state.image, state.source, zoomPreview);
    drawAnnotation(ctx, sourcePreview, zoomPreview, settings);
  }

  function drawZoomedCrop(targetCtx, image, source, zoom) {
    targetCtx.save();
    targetCtx.imageSmoothingEnabled = false;
    targetCtx.drawImage(
      image,
      source.x,
      source.y,
      source.width,
      source.height,
      zoom.x,
      zoom.y,
      zoom.width,
      zoom.height,
    );
    targetCtx.restore();
  }

  function drawAnnotation(targetCtx, source, zoom, settings) {
    targetCtx.save();
    targetCtx.strokeStyle = settings.lineColor;
    targetCtx.fillStyle = settings.lineColor;
    targetCtx.lineWidth = settings.lineWidth;
    targetCtx.lineJoin = 'miter';
    targetCtx.lineCap = settings.lineStyle === 'dotted' ? 'round' : 'butt';

    targetCtx.strokeRect(source.x, source.y, source.width, source.height);
    targetCtx.strokeRect(zoom.x, zoom.y, zoom.width, zoom.height);

    const lines = getConnectionPoints(settings.corner, source, zoom);
    lines.forEach(([start, end]) => drawStyledLine(targetCtx, start, end, settings));
    targetCtx.restore();
  }

  function drawStyledLine(targetCtx, start, end, settings) {
    if (settings.lineStyle === 'double') {
      drawDoubleLine(targetCtx, start, end, settings);
      return;
    }

    targetCtx.save();
    targetCtx.setLineDash(getLinePattern(settings.lineStyle, settings.lineWidth));
    targetCtx.beginPath();
    targetCtx.moveTo(start.x, start.y);
    targetCtx.lineTo(end.x, end.y);
    targetCtx.stroke();
    targetCtx.restore();

    if (settings.lineStyle === 'arrow') {
      drawArrowhead(targetCtx, start, end, settings.lineColor, settings.lineWidth);
      drawArrowhead(targetCtx, end, start, settings.lineColor, settings.lineWidth);
    }
  }

  function drawDoubleLine(targetCtx, start, end, settings) {
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    const length = Math.hypot(dx, dy);
    if (!length) return;
    const offset = Math.max(3, settings.lineWidth + 2) / 2;
    const ux = (-dy / length) * offset;
    const uy = (dx / length) * offset;

    targetCtx.save();
    targetCtx.lineWidth = Math.max(1, settings.lineWidth - 1);
    targetCtx.setLineDash([]);
    targetCtx.beginPath();
    targetCtx.moveTo(start.x + ux, start.y + uy);
    targetCtx.lineTo(end.x + ux, end.y + uy);
    targetCtx.moveTo(start.x - ux, start.y - uy);
    targetCtx.lineTo(end.x - ux, end.y - uy);
    targetCtx.stroke();
    targetCtx.restore();
  }

  function drawArrowhead(targetCtx, from, tip, color, width) {
    const dx = tip.x - from.x;
    const dy = tip.y - from.y;
    const length = Math.hypot(dx, dy);
    if (!length) return;

    const ux = dx / length;
    const uy = dy / length;
    const size = Math.max(10, width * 5);
    const spread = 0.4;
    const bx = tip.x - ux * size;
    const by = tip.y - uy * size;

    targetCtx.save();
    targetCtx.fillStyle = color;
    targetCtx.beginPath();
    targetCtx.moveTo(tip.x, tip.y);
    targetCtx.lineTo(bx - uy * size * spread, by + ux * size * spread);
    targetCtx.lineTo(bx + uy * size * spread, by - ux * size * spread);
    targetCtx.closePath();
    targetCtx.fill();
    targetCtx.restore();
  }

  function loadFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      setStatus('无法加载：请选择图片文件。');
      return;
    }

    const objectUrl = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(objectUrl);
      state.image = image;
      state.fileName = file.name || 'image';
      state.source = null;
      elements.emptyState.hidden = true;
      elements.exportButton.disabled = false;
      elements.locateButton.disabled = false;
      elements.imageMeta.textContent = `${state.fileName} · ${image.naturalWidth} × ${image.naturalHeight}`;
      setStatus(`已加载 ${state.fileName}，点击图片或输入坐标放置放大框。`);
      resizeCanvas();
    };
    image.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      setStatus('图片加载失败，请尝试 PNG、JPEG、WebP 或 BMP 格式。');
    };
    image.src = objectUrl;
  }

  function exportPng() {
    if (!state.image) return;
    const width = state.image.naturalWidth;
    const height = state.image.naturalHeight;
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = width;
    exportCanvas.height = height;
    const exportCtx = exportCanvas.getContext('2d');

    exportCtx.drawImage(state.image, 0, 0);
    if (state.source) {
      const settings = currentSettings();
      const source = clampSourceBox(state.source, width, height);
      const zoom = computeZoomBox(
        settings.corner,
        width,
        height,
        source.width * settings.zoomFactor,
        source.height * settings.zoomFactor,
        PAD,
      );
      drawZoomedCrop(exportCtx, state.image, source, zoom);
      drawAnnotation(exportCtx, source, zoom, settings);
    }

    exportCanvas.toBlob((blob) => {
      if (!blob) {
        setStatus('导出失败：浏览器未能生成 PNG。');
        return;
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const stem = state.fileName.replace(/\.[^.]+$/, '') || 'zoom_result';
      link.href = url;
      link.download = `${stem}_zoom.png`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setStatus(`已导出 ${stem}_zoom.png（${width} × ${height}）。`);
    }, 'image/png');
  }

  function sourceContainsPreviewPoint(point) {
    if (!state.source) return false;
    const source = originalToPreviewBox(state.source);
    return point.previewX >= source.x && point.previewX <= source.x + source.width && point.previewY >= source.y && point.previewY <= source.y + source.height;
  }

  function onPointerDown(event) {
    if (!state.image) return;
    const point = previewPointToOriginal(event.clientX, event.clientY);
    if (!point.inside) return;

    elements.canvas.setPointerCapture(event.pointerId);
    if (sourceContainsPreviewPoint(point)) {
      state.drag = {
        pointerId: event.pointerId,
        offsetX: point.x - state.source.x,
        offsetY: point.y - state.source.y,
      };
      elements.canvas.style.cursor = 'grabbing';
      return;
    }

    const settings = currentSettings();
    setSource({ x: point.x, y: point.y, width: settings.boxWidth, height: settings.boxHeight });
    state.drag = {
      pointerId: event.pointerId,
      offsetX: 0,
      offsetY: 0,
      newlyPlaced: true,
    };
    setStatus(`源框位置：(${state.source.x}, ${state.source.y})。`);
  }

  function onPointerMove(event) {
    if (!state.image) return;
    const point = previewPointToOriginal(event.clientX, event.clientY);

    if (state.drag && state.drag.pointerId === event.pointerId && state.source) {
      if (!state.drag.newlyPlaced) {
        setSource({
          ...state.source,
          x: point.x - state.drag.offsetX,
          y: point.y - state.drag.offsetY,
        });
        setStatus(`源框位置：(${state.source.x}, ${state.source.y})。`);
      }
      return;
    }

    elements.canvas.style.cursor = point.inside && sourceContainsPreviewPoint(point) ? 'grab' : 'crosshair';
  }

  function onPointerUp(event) {
    if (state.drag && state.drag.pointerId === event.pointerId) {
      state.drag = null;
      elements.canvas.style.cursor = 'crosshair';
      if (elements.canvas.hasPointerCapture(event.pointerId)) elements.canvas.releasePointerCapture(event.pointerId);
    }
  }

  function wireEvents() {
    elements.imageInput.addEventListener('change', (event) => {
      loadFile(event.target.files?.[0]);
      event.target.value = '';
    });

    elements.exportButton.addEventListener('click', exportPng);
    elements.locateButton.addEventListener('click', applyCoordinates);
    [elements.coordX, elements.coordY].forEach((input) => {
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') applyCoordinates();
      });
      input.addEventListener('change', applyCoordinates);
    });

    [elements.boxWidth, elements.boxHeight].forEach((input) => {
      input.addEventListener('input', syncSourceSize);
      input.addEventListener('change', syncSourceSize);
    });

    elements.zoomFactor.addEventListener('input', () => { updateOutputs(); renderPreview(); });
    elements.lineWidth.addEventListener('input', () => { updateOutputs(); renderPreview(); });
    elements.lineStyle.addEventListener('change', renderPreview);
    elements.lineColor.addEventListener('input', (event) => setLineColor(event.target.value));

    document.querySelectorAll('input[name="zoomCorner"]').forEach((input) => {
      input.addEventListener('change', (event) => {
        if (!event.target.checked) return;
        state.corner = event.target.value;
        renderPreview();
      });
    });

    elements.canvas.addEventListener('pointerdown', onPointerDown);
    elements.canvas.addEventListener('pointermove', onPointerMove);
    elements.canvas.addEventListener('pointerup', onPointerUp);
    elements.canvas.addEventListener('pointercancel', onPointerUp);

    window.addEventListener('resize', resizeCanvas);
    new ResizeObserver(resizeCanvas).observe(elements.canvasStage);

    ['dragenter', 'dragover'].forEach((name) => {
      elements.canvasStage.addEventListener(name, (event) => {
        event.preventDefault();
        state.dragDepth += name === 'dragenter' ? 1 : 0;
        elements.dropOverlay.hidden = false;
      });
    });

    elements.canvasStage.addEventListener('dragleave', (event) => {
      event.preventDefault();
      state.dragDepth = Math.max(0, state.dragDepth - 1);
      if (state.dragDepth === 0) elements.dropOverlay.hidden = true;
    });

    elements.canvasStage.addEventListener('drop', (event) => {
      event.preventDefault();
      state.dragDepth = 0;
      elements.dropOverlay.hidden = true;
      loadFile(event.dataTransfer?.files?.[0]);
    });
  }

  buildColorPalette();
  updateOutputs();
  wireEvents();
  resizeCanvas();
})();

</script>
