<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrameLab</title><style>body{margin:0;background:#f6f8fc;color:#26344b;font:14px system-ui}header{background:white;padding:24px 5%;border-bottom:1px solid #e5eaf2}h1{margin:0;font-size:26px}h1 span{color:#5278e8}small{color:#8996aa}.layout{display:grid;grid-template-columns:230px 1fr 260px;gap:18px;max-width:1400px;margin:25px auto;padding:0 20px}.panel{background:white;border:1px solid #e5eaf2;border-radius:18px;padding:20px;min-width:0;box-shadow:0 8px 30px #21344c08}h3{margin:0 0 20px}button,select,input{font:inherit;border:1px solid #dfe5ef;border-radius:9px;padding:10px;background:white;max-width:100%;box-sizing:border-box}button{cursor:pointer}button:hover{background:#edf2ff}.primary{background:#557be9;color:white;border:0;width:100%;padding:14px}.upload{display:block;text-align:center;padding:30px 8px;border:2px dashed #bdcbe7;border-radius:13px;cursor:pointer;background:#f7f9ff}.upload b{display:block;margin:8px}input[type=file]{display:none}.files{max-height:55vh;overflow:auto;margin-top:14px}.file{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;font-size:12px;overflow:hidden}.file img{width:48px;height:42px;object-fit:cover;border-radius:6px}.file.active{background:#edf2ff}.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage{min-height:570px}.canvasbox{height:460px;background-color:#f0f3f8;background-image:radial-gradient(#d6dfea 1px,transparent 1px);background-size:18px 18px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:16px 0;overflow:hidden;padding:15px;box-sizing:border-box}#canvas{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair;box-shadow:0 12px 35px #24334b25}.buttons{display:flex;gap:8px;flex-wrap:wrap}label.field{display:block;font-weight:600;font-size:12px;margin:18px 0 7px}select{width:100%} .selection-tools{margin:20px 0 4px;padding:17px 18px 18px;border:1px solid #e7ecf5;border-radius:14px;background:#fbfcff}.selection-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.selection-head strong{font-size:14px}.selection-head small{font-size:11px}.selection-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.sel-field{display:flex;flex-direction:column;gap:7px;min-width:0}.sel-field span{color:#738199;font-size:12px;font-weight:600}.sel-field input{width:100%;min-width:0;padding:10px 9px;background:#fff;font-variant-numeric:tabular-nums}.selection-meta{margin-top:10px;color:#8390a5;font-size:11px}.selection-meta b{color:#526682;font-weight:600}@media(max-width:540px){.selection-grid{grid-template-columns:repeat(2,minmax(0,1fr))}} .size{display:flex;gap:8px}.size input{width:50%;min-width:0}#preview{display:block;max-width:100%;max-height:150px;margin:15px auto;background:#f4f6fa}p{font-size:12px;color:#8793a7;line-height:1.7}#status{color:#5278e8}@media(max-width:1000px){.layout{grid-template-columns:1fr}.stage{min-height:0}}</style><header><h1>Frame<span>Lab</span> <small style="font-size:14px">/ Crop & Scale</small></h1><small>批量图片 · 自由框选 · 等比缩放 · 本地导出</small></header><div class="layout"><section class="panel"><h3>图片素材 <small id="count">0 张</small></h3><label class="upload" id="drop"><span style="font-size:32px;color:#5278e8">＋</span><b>添加图片</b><small>点击或拖入多张图片</small><input id="upload" type="file" accept="image/*" multiple></label><div class="files" id="files"></div></section><section class="panel stage"><h3>区域编辑器</h3><small id="name">在图片上拖动鼠标创建矩形选区</small><div class="canvasbox"><canvas id="canvas" style="display:none"></canvas><small id="empty">上传图片以开始</small></div><div class="selection-tools"><div class="selection-head"><strong>精确选区 <small>· 像素 px</small></strong><small id="source-size">原图：—</small></div><div class="selection-grid"><label class="sel-field"><span>X · 左侧位置</span><input id="sel-x" type="number" min="0" step="1" value="0" aria-label="选区横坐标"></label><label class="sel-field"><span>Y · 顶部位置</span><input id="sel-y" type="number" min="0" step="1" value="0" aria-label="选区纵坐标"></label><label class="sel-field"><span>宽度 W</span><input id="sel-w" type="number" min="1" step="1" value="1" aria-label="选区宽度"></label><label class="sel-field"><span>高度 H</span><input id="sel-h" type="number" min="1" step="1" value="1" aria-label="选区高度"></label></div><div class="selection-meta">修改任意数值即可实时调整选框；宽度和高度不会超过原图边界。</div></div><div class="buttons"><button id="full">选择整张</button><button id="center">居中 80%</button><button id="apply">同步选区到全部图片</button><button id="remove">移除当前</button></div><p>可拖动矩形内部移动选区，拖动四角调整尺寸。同步选区会按照相对位置与比例适配不同分辨率的图片。</p></section><section class="panel"><h3>导出设置</h3><label class="field">目标宽度 × 高度（px）</label><div class="size"><input id="w" type="number" value="1024" min="1"><input id="h" type="number" value="1024" min="1"></div><label class="field">缩放模式</label><select id="mode"><option value="contain">完整等比缩放 · 留白</option><option value="cover">等比填满 · 裁切</option><option value="natural">按宽度等比缩放 · 高度自动</option></select><label class="field">背景</label><select id="bg"><option value="white">白色</option><option value="black">黑色</option><option value="transparent">透明</option></select><label class="field">文件格式</label><select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select><label class="field">导出范围</label><select id="scope"><option value="all">全部图片（ZIP）</option><option value="current">当前图片</option></select><label class="field">实时预览</label><canvas id="preview" width="240" height="160"></canvas><small id="info">等待图片</small><hr style="border:0;border-top:1px solid #edf0f5;margin:22px 0"><button class="primary" id="export">↓ 一键保存结果</button><p id="status">所有图片仅在浏览器本地处理</p></section></div><script>
const $=x=>document.getElementById(x),cv=$('canvas'),cx=cv.getContext('2d'),pv=$('preview'),pc=pv.getContext('2d');let images=[],idx=-1,drag=null;const cur=()=>images[idx],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function add(fs){for(let f of fs){if(!f.type.startsWith('image/'))continue;let url=URL.createObjectURL(f),im=new Image;im.onload=()=>{images.push({f,url,im,r:{x:0,y:0,w:im.width,h:im.height}});if(idx<0)idx=0;render()};im.src=url}}$('upload').onchange=e=>{add(e.target.files);e.target.value=''};$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();add(e.dataTransfer.files)};function render(){let a=cur();$('count').textContent=images.length+' 张';$('files').replaceChildren();images.forEach((v,j)=>{let el=document.createElement('div');el.className='file'+(j===idx?' active':'');let img=document.createElement('img');img.src=v.url;let s=document.createElement('span');s.textContent=v.f.name;el.append(img,s);el.onclick=()=>{idx=j;render()};$('files').append(el)});cv.style.display=a?'block':'none';$('empty').style.display=a?'none':'block';$('name').textContent=a?a.f.name:'在图片上拖动鼠标创建矩形选区';if(a){let scale=Math.min(900/a.im.width,420/a.im.height,1);cv.width=Math.round(a.im.width*scale);cv.height=Math.round(a.im.height*scale);draw()}syncSelectionInputs();preview()}function syncSelectionInputs(){let a=cur(),ids=['sel-x','sel-y','sel-w','sel-h'];ids.forEach((id,i)=>{let el=$(id);el.disabled=!a;if(!a){el.value=i<2?'0':'1';return;}let key=['x','y','w','h'][i];if(document.activeElement!==el)el.value=Math.round(a.r[key]);let bound=key==='x'?a.im.width-a.r.w:key==='y'?a.im.height-a.r.h:key==='w'?a.im.width-a.r.x:a.im.height-a.r.y;el.max=Math.max(key==='w'||key==='h'?1:0,Math.floor(bound));});$('source-size').textContent=a?`原图：${a.im.width} × ${a.im.height} px`:'原图：—'}
['x','y','w','h'].forEach(key=>{$('sel-'+key).addEventListener('input',e=>{let a=cur();if(!a||e.target.value==='')return;let n=Number(e.target.value);if(!Number.isFinite(n))return;n=Math.round(n);let r=a.r;if(key==='x')r.x=clamp(n,0,Math.max(0,a.im.width-r.w));if(key==='y')r.y=clamp(n,0,Math.max(0,a.im.height-r.h));if(key==='w')r.w=clamp(n,1,Math.max(1,a.im.width-r.x));if(key==='h')r.h=clamp(n,1,Math.max(1,a.im.height-r.y));draw();preview();});$('sel-'+key).addEventListener('change',()=>syncSelectionInputs());$('sel-'+key).addEventListener('blur',()=>syncSelectionInputs());});
function corners(r){return [[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]]}function draw(){let a=cur();if(!a)return;let sx=cv.width/a.im.width,sy=cv.height/a.im.height,r=a.r;cx.drawImage(a.im,0,0,cv.width,cv.height);cx.fillStyle='#0b1a3070';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(a.im,r.x,r.y,r.w,r.h,r.x*sx,r.y*sy,r.w*sx,r.h*sy);cx.strokeStyle='#fff';cx.lineWidth=2;cx.strokeRect(r.x*sx,r.y*sy,r.w*sx,r.h*sy);corners(r).forEach(([x,y])=>{cx.fillStyle='white';cx.fillRect(x*sx-5,y*sy-5,10,10);cx.strokeStyle='#5278e8';cx.strokeRect(x*sx-5,y*sy-5,10,10)});syncSelectionInputs()}function pt(e){let b=cv.getBoundingClientRect(),a=cur();return{x:clamp((e.clientX-b.left)/b.width*a.im.width,0,a.im.width),y:clamp((e.clientY-b.top)/b.height*a.im.height,0,a.im.height)}}cv.onpointerdown=e=>{let a=cur(),p=pt(e),r={...a.r},tol=12*a.im.width/cv.width,k=corners(r).findIndex(([x,y])=>Math.abs(x-p.x)<tol&&Math.abs(y-p.y)<tol);drag={p,r,k,kind:k>=0?'resize':p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h?'move':'new'};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;let a=cur(),p=pt(e),d=drag,r,dx=p.x-d.p.x,dy=p.y-d.p.y;if(d.kind==='move')r={...d.r,x:clamp(d.r.x+dx,0,a.im.width-d.r.w),y:clamp(d.r.y+dy,0,a.im.height-d.r.h)};else{let q=d.kind==='new'?d.p:{x:corners(d.r)[3-d.k][0],y:corners(d.r)[3-d.k][1]};r={x:Math.min(q.x,p.x),y:Math.min(q.y,p.y),w:Math.abs(q.x-p.x),h:Math.abs(q.y-p.y)}}if(r.w>=2&&r.h>=2){a.r=r;draw();preview()}};cv.onpointerup=()=>drag=null;cv.onpointercancel=()=>drag=null;$('full').onclick=()=>{let a=cur();if(a){a.r={x:0,y:0,w:a.im.width,h:a.im.height};draw();preview()}};$('center').onclick=()=>{let a=cur();if(a){a.r={x:a.im.width*.1,y:a.im.height*.1,w:a.im.width*.8,h:a.im.height*.8};draw();preview()}};$('apply').onclick=()=>{let a=cur();if(!a)return;let r=a.r;images.forEach(v=>v.r={x:r.x/a.im.width*v.im.width,y:r.y/a.im.height*v.im.height,w:r.w/a.im.width*v.im.width,h:r.h/a.im.height*v.im.height});$('status').textContent='已同步选区到 '+images.length+' 张图片'};$('remove').onclick=()=>{if(!cur())return;URL.revokeObjectURL(cur().url);images.splice(idx,1);idx=images.length?Math.min(idx,images.length-1):-1;render()};function output(a,limit){let w=clamp(+$('w').value||1024,1,16000),h=clamp(+$('h').value||1024,1,16000),r=a.r,mode=$('mode').value;if(mode==='natural')h=Math.max(1,Math.round(w*r.h/r.w));if(limit){let s=Math.min(240/w,160/h,1);w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s))}let c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d');if($('bg').value!=='transparent'||$('format').value==='image/jpeg'){x.fillStyle=$('bg').value==='black'?'#000':'#fff';x.fillRect(0,0,w,h)}let s=mode==='cover'?Math.max(w/r.w,h/r.h):Math.min(w/r.w,h/r.h);x.drawImage(a.im,r.x,r.y,r.w,r.h,(w-r.w*s)/2,(h-r.h*s)/2,r.w*s,r.h*s);return c}function preview(){pc.clearRect(0,0,pv.width,pv.height);let a=cur();if(!a){$('info').textContent='等待图片';return}let c=output(a,true);pv.width=c.width;pv.height=c.height;pc.drawImage(c,0,0);$('info').textContent=`选区 ${Math.round(a.r.w)} × ${Math.round(a.r.h)} px · 输出 ${$('w').value} px 宽`;}['w','h','mode','bg','format'].forEach(id=>$(id).oninput=preview);function download(blob,name){let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}function blob(c){return new Promise(ok=>c.toBlob(ok,$('format').value,.95))}function ext(){return {'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[$('format').value]}function crc32(b){let c=-1;for(let v of b){c^=v;for(let j=0;j<8;j++)c=c>>>1^(c&1?0xedb88320:0)}return(c^-1)>>>0}function zip(files){let chunks=[],central=[],offset=0;const enc=new TextEncoder;function u16(v){return [v&255,v>>>8&255]}function u32(v){return [...u16(v&65535),...u16(v>>>16)]}for(let f of files){let name=enc.encode(f.name),data=f.data,crc=crc32(data),head=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name]);chunks.push(head,data);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]));offset+=head.length+data.length}let size=central.reduce((s,b)=>s+b.length,0);return new Blob([...chunks,...central,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(size),...u32(offset),...u16(0)])],{type:'application/zip'})}$('export').onclick=async()=>{if(!cur())return alert('请先添加图片');let arr=$('scope').value==='current'?[cur()]:images,files=[];try{for(let j=0;j<arr.length;j++){let a=arr[j],b=await blob(output(a,false));if(!b)throw Error('图片生成失败');let name=a.f.name.replace(/\.[^.]+$/,'')+'_scaled.'+ext();files.push({name:(j+1)+'_'+name,data:new Uint8Array(await b.arrayBuffer())});$('status').textContent=`正在处理 ${j+1}/${arr.length}`}if(files.length===1)download(new Blob([files[0].data]),files[0].name);else download(zip(files),'FrameLab_Export.zip');$('status').textContent=`已完成 ${files.length} 张图片的导出`}catch(e){$('status').textContent='导出失败：'+e.message}};render();</script></html>
